# For testing on different servers
name: Matrix Configuration

on:
  push: 
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-20.04]
        images: [hello-world, alpine]
       
    runs-on: ${{ matrix.os }}

    steps:
      - name: Echo Docker Details
        run: docker info

      - name: Run Docker Images on ${{matrix.os}}
        run: docker run ${{matrix.images}}

  
    
  