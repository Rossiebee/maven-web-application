name: Docker-Concurrency Job

on:
  push: # - push:
    branches:
    - main
  # workflow_dispatch:

env:
    CONTAINER_REGISTRY: docker.io
    IMAGE_NAME: teqsify-app
    IMAGE_TAG: v.1
jobs:
  docker_build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: List repo root structure
      run: ls -al

    # - name: Debug - List webapp directory content
    #   run: ls -al teqsify-webapp || echo "teqsify-webapp folder not found"
       
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
      
    - name: Maven Build
      run: mvn clean package -DskipTests

    - name: Docker Build Image
      run: docker build -t ${{env.CONTAINER_REGISTRY}}/${{vars.CONTAINER_REGISTRY_USERNAME}}/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}} .

    - name: View Docker Images
      run: docker images
   
    - name: Docker Login
      run: docker login --username=${{vars.CONTAINER_REGISTRY_USERNAME}} --password=${{secrets.CONTAINER_REGISTRY_PASSWORD}}
      
    - name: Docker Push Image
      run: docker push ${{env.CONTAINER_REGISTRY}}/${{vars.CONTAINER_REGISTRY_USERNAME}}/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}

  docker_deploy: 
    needs: docker_build
    concurrency:
      group: production-deployment
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Docker Login
        run: docker login --username=${{vars.CONTAINER_REGISTRY_USERNAME}} --password=${{secrets.CONTAINER_REGISTRY_PASSWORD}}
      
      - name: Docker run
        run: |
          docker run -d -p 8080:8080 --name teqsify-webapp ${{env.CONTAINER_REGISTRY}}/${{vars.CONTAINER_REGISTRY_USERNAME}}/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}
          sleep 5 #give app time to start
          curl --fail http://localhost:8080/maven-web-app || (docker logs teqsify-webapp && exit 1)

