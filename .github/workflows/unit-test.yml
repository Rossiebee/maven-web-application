name: Teqsify App Build, Unit Test and Deploy

on:
  push:

env:
  CONTAINER_REGISTRY: docker.io
  IMAGE_NAME: teqsify-app
  IMAGE_TAG: v1

jobs:
  docker_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Maven Build (skip tests)
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: teqsify-app-jar
          path: |
            target/**/*.jar

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/

      - name: List test report files
        run: ls -l target/surefire-reports || echo "No reports found"

      - name: Docker Build Image
        run: docker build -t ${{ env.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: View Docker Images
        run: docker images

      - name: Docker Login
        run: docker login --username=${{ vars.CONTAINER_REGISTRY_USERNAME }} --password=${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Docker Push Image
        run: docker push ${{ env.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  docker_deploy:
    needs: docker_build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: teqsify-app-jar
          path: ./downloaded-artifacts/jar

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: junit-test-reports
          path: ./downloaded-artifacts/test-reports

      - name: List downloaded files
        run: |
          echo "JARs:"
          ls -al ./downloaded-artifacts/jar
          echo "Test reports:"
          ls -al ./downloaded-artifacts/test-reports

      - name: Docker Login
        run: docker login --username=${{ vars.CONTAINER_REGISTRY_USERNAME }} --password=${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Pull and Run Container
        run: |
          docker pull ${{ env.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker run -d -p 8080:8080 --name teqsify-webapp ${{ env.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          sleep 10
          curl --fail http://localhost:8080/maven-web-app || (docker logs teqsify-webapp && exit 1)
